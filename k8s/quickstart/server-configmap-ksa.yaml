apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "example.org"
      data_dir = "/run/spire/data"
      log_level = "DEBUG"
      ca_key_type = "rsa-2048"
      jwt_issuer = "http://spire-server.spire.svc.cluster.local:8080"
      ca_subject = {
        country = ["US"],
        organization = ["SPIFFE"],
        common_name = "",
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "demo-cluster" = {
              service_account_allow_list = ["spire:spire-agent"]
            }
          }
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }

      # Method 2: SPIRE authenticates to OpenBao with the projected SA token.
      # Remote OpenBao: set k8s_auth_mount_point = "jwt/k8s"
      UpstreamAuthority "vault" {
        plugin_data {
          vault_addr = "http://openbao.default.svc.cluster.local:8200"
          pki_mount_point = "pki_int"
          insecure_skip_verify = true
          k8s_auth {
            k8s_auth_mount_point = "kubernetes"
            k8s_auth_role_name = "spire-server"
            token_path = "/var/run/secrets/tokens/spire-server"
          }
        }
      }

      Notifier "k8sbundle" {
        plugin_data {
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8008"
      live_path = "/live"
      ready_path = "/ready"
    }
